<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浙工大校园地图 · 界面概念图 v0.1</title>
<style>
  :root{
    --green:#0B9B63; --green-dark:#067A4D; --green-soft:#E3F4EC;
    --ink:#1F2937; --muted:#8A949E; --line:#E7ECE9; --page:#F2F5F3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#151A17;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    padding:44px 24px 60px;
  }
  .page-title{color:#fff;text-align:center;font-size:24px;font-weight:700;letter-spacing:.5px}
  .page-sub{color:#93A29A;text-align:center;font-size:13px;margin-top:8px;margin-bottom:36px}
  .deck{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;align-items:flex-start}
  figure.screen{width:352px}
  .phone{background:#0C0D0C;border-radius:46px;padding:10px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .screen-inner{background:var(--page);border-radius:36px;overflow:hidden;height:752px;display:flex;flex-direction:column;position:relative}
  figcaption{color:#C9D4CD;text-align:center;font-size:13px;margin-top:14px}
  figcaption b{color:#fff;font-weight:600}

  /* 状态栏 */
  .status{height:32px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:600;flex:none}
  .status .right{display:flex;align-items:center;gap:4px;font-size:11px}
  .batt{width:22px;height:11px;border:1px solid #333;border-radius:3px;position:relative}
  .batt::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:13px;background:#333;border-radius:1px}
  .batt::before{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#333;border-radius:0 1px 1px 0}

  /* 顶栏 */
  .topbar{background:#fff;padding:10px 14px 12px;display:flex;align-items:center;gap:8px;flex:none;border-bottom:1px solid var(--line)}
  .campus-pill{background:var(--green-soft);color:var(--green-dark);font-size:12px;font-weight:600;padding:7px 10px;border-radius:18px;white-space:nowrap;flex:none}
  .search{flex:1;background:var(--page);border-radius:18px;padding:8px 12px;font-size:12.5px;color:#B4BEC0;display:flex;align-items:center;gap:6px}
  .back{font-size:17px;color:var(--ink);flex:none;cursor:pointer}
  .top-title{flex:1;font-size:16px;font-weight:700}
  .top-more{font-size:15px;color:var(--muted);letter-spacing:1px}
  .badge2{background:#F59E0B;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;margin-left:6px;vertical-align:2px}

  /* 分类 chips */
  .chips{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden;flex:none}
  .chip{font-size:12px;padding:6px 13px;border-radius:15px;background:var(--page);color:#6B7680;white-space:nowrap}
  .chip.on{background:var(--green);color:#fff;font-weight:600}

  /* 地图区 */
  .mapwrap{flex:1;position:relative;background:#E4EEE2}
  .mapwrap svg{display:block;width:100%;height:100%}
  .locpill{position:absolute;top:10px;left:10px;background:#fff;border-radius:14px;padding:6px 10px;font-size:11.5px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.12);color:var(--ink)}
  .zoombtn{position:absolute;right:10px;bottom:96px;background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;font-size:15px;color:#5B6570}
  .zoombtn span{padding:7px 11px;cursor:pointer}

  /* 点位卡片（浮层） */
  .poi-card{position:absolute;left:10px;right:10px;bottom:12px;background:#fff;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .poi-emoji{width:40px;height:40px;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .poi-name{font-size:14px;font-weight:700}
  .poi-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .go-btn{flex:none;background:var(--green);color:#fff;font-size:12.5px;font-weight:600;border:none;border-radius:18px;padding:8px 16px}

  /* 食堂页 */
  .banner{margin:12px 12px 4px;background:linear-gradient(120deg,var(--green) 0%,#12B377 100%);border-radius:16px;padding:14px 16px;color:#fff;flex:none}
  .banner .t1{font-size:15px;font-weight:700}
  .banner .t2{font-size:11.5px;opacity:.9;margin-top:3px}
  .floors{display:flex;gap:8px;padding:10px 12px;flex:none}
  .floor{flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:12px;background:#fff;color:#6B7680}
  .floor.on{background:var(--green);color:#fff}
  .winlist{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:2px 12px}
  .win{background:#fff;border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px}
  .win .ico{width:42px;height:42px;border-radius:12px;background:var(--page);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .win .info{flex:1}
  .win .name{font-size:14px;font-weight:700}
  .win .tags{display:flex;gap:5px;margin-top:5px}
  .tag{font-size:10.5px;background:var(--green-soft);color:var(--green-dark);padding:2.5px 8px;border-radius:9px}
  .tag.hot{background:#FEF3E2;color:#C77E1B}
  .win .open{font-size:11px;color:var(--green);flex:none;display:flex;align-items:center;gap:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .maintain{margin:4px 12px 12px;background:#FFF9EC;border:1px dashed #EAD9A6;border-radius:12px;padding:9px 12px;font-size:11.5px;color:#A67C1E;flex:none}

  /* 导航页 */
  .route-sum{position:absolute;left:10px;right:10px;top:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .route-sum .r1{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .route-sum .r2{display:flex;gap:16px;margin-top:7px;font-size:11.5px;color:#5B6570}
  .route-sum .r2 b{color:var(--ink)}
  .start-btn{position:absolute;left:10px;right:10px;bottom:12px;background:var(--green);color:#fff;font-size:14.5px;font-weight:700;border:none;border-radius:16px;padding:13px 0;box-shadow:0 8px 20px rgba(11,155,99,.4)}
  .narrate{position:absolute;left:10px;right:10px;bottom:64px;background:#fff;border-radius:16px;padding:11px 13px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
  .narrate .n-t{font-size:12px;font-weight:700;color:var(--green-dark);margin-bottom:5px}
  .narrate .n-c{font-size:11.5px;color:#5B6570;line-height:1.6}

  /* 社区页 */
  .comm-banner{margin:12px 12px 4px;background:linear-gradient(120deg,#0F7A52 0%,var(--green) 100%);border-radius:16px;padding:16px;color:#fff;flex:none}
  .comm-banner .c1{font-size:16px;font-weight:800}
  .comm-banner .c2{font-size:11.5px;opacity:.9;margin-top:4px}
  .bchips{display:flex;gap:8px;padding:10px 12px;flex:none}
  .bchip{font-size:12px;padding:6px 14px;border-radius:15px;background:#fff;color:#6B7680;font-weight:600}
  .bchip.on{background:var(--green);color:#fff}
  .posts{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:2px 12px}
  .post{background:#fff;border-radius:14px;padding:12px;display:flex;gap:11px;align-items:center}
  .post .p-emoji{font-size:26px;flex:none}
  .post .p-main{flex:1}
  .post .p-t{font-size:13.5px;font-weight:700}
  .post .p-m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
  .post .p-tag{font-size:10px;background:#EEF2F8;color:#5B6570;padding:2px 7px;border-radius:8px;flex:none}
  .post .p-go{flex:none;background:var(--green-soft);color:var(--green-dark);font-size:11.5px;font-weight:600;border-radius:14px;padding:6px 11px}
  .review-teaser{margin:4px 12px 12px;background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;flex:none}
  .review-teaser .big{font-size:24px}
  .review-teaser .rt{font-size:13px;font-weight:700}
  .review-teaser .rs{font-size:11px;color:var(--muted);margin-top:2px}
  .review-teaser .soon{margin-left:auto;font-size:10px;background:#FEF3E2;color:#C77E1B;padding:3px 9px;border-radius:9px;font-weight:600}

  /* 底部标签栏 */
  .tabbar{background:#fff;border-top:1px solid var(--line);display:flex;padding:9px 0 20px;flex:none}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
  .tab .t-ico{font-size:17px;filter:grayscale(1);opacity:.55}
  .tab.active{color:var(--green);font-weight:600}
  .tab.active .t-ico{filter:none;opacity:1}
</style>
</head>
